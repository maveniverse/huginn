# Runnable as `jbang eu.maveniverse.maven.mcp:maven-mcp:<version>:runner`
quarkus.package.jar.type=uber-jar

# stdout belongs to the MCP protocol: keep logs off the console.
quarkus.log.console.enabled=false
quarkus.log.file.enabled=true
quarkus.log.file.path=${user.home}/.cache/maven-mcp/maven-mcp.log

quarkus.banner.enabled=false

## debugging
#quarkus.log.level=DEBUG
#quarkus.mcp.server.traffic-logging.enabled=true
#quarkus.mcp.server.traffic-logging.text-limit=200
